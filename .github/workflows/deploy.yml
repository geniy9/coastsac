name: Deploy Nuxt SSR SPA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build SSR Site
        run: bun run build
        env:
          ORIGIN: ${{ secrets.ORIGIN }}
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NUXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          FUEL_CARD_API_TOKEN: ${{ secrets.FUEL_CARD_API_TOKEN }}

      - name: Create .env file
        run: |
          echo "FUEL_CARD_API_TOKEN=${{ secrets.FUEL_CARD_API_TOKEN }}" >> .env
          echo "STRAPI_URL=${{ secrets.STRAPI_URL }}" >> .env
          echo "ORIGIN=${{ secrets.ORIGIN }}" >> .env

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlptzvi --delete"
          SOURCE: ".output/ .env ecosystem.config.js"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.TARGET_DIR }}
          EXCLUDE: "/dist/, /node_modules/"
          SCRIPT_AFTER: |
            # 1. Включаем строгий режим bash
            set -ex
            
            # 2. Инициализируем окружение для PM2
            export HOME=/home/${{ secrets.REMOTE_USER }}
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            
            cd ${{ secrets.TARGET_DIR }}
            
            pm2 startOrReload ecosystem.config.js --update-env
            
            pm2 save